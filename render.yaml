services:
  - type: web
    name: fuelms-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_CONFIG
        value: app.config.ProductionConfig
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fuelms-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: fuelms-db
    plan: free
